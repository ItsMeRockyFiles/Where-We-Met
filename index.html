<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where We Met</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header id="app-header">
    <h1>Where We Met</h1>
    <p>Click anywhere on the map to pin a memory.</p>
  </header>

  <div id="map"></div>

  <button id="locate-btn" aria-label="Center on my location">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      <circle cx="12" cy="12" r="8"/>
    </svg>
  </button>

  <div id="modal" class="hidden">
    <form id="memory-form">
      <h2>New Memory</h2>
      <div id="nearby-hint" class="hidden"></div>

      <label for="title">Title</label>
      <input type="text" id="title" placeholder="e.g. Our first date" required maxlength="80" />

      <label for="date">Date</label>
      <input type="date" id="date" />

      <label for="description">Description</label>
      <textarea id="description" rows="3" placeholder="What happened here?" maxlength="500"></textarea>

      <label for="photo">Photo</label>
      <div class="photo-upload">
        <input type="file" id="photo" accept="image/*" hidden />
        <label for="photo" class="photo-upload-btn" id="photo-label">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          <span>Choose a photo</span>
        </label>
        <div class="photo-preview hidden" id="photo-preview">
          <img id="photo-preview-img" alt="Preview" />
          <button type="button" class="photo-remove" id="photo-remove" aria-label="Remove photo">×</button>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit">Save Memory</button>
      </div>
    </form>
  </div>

  <aside id="sidebar" aria-hidden="true">
    <button id="close-sidebar" aria-label="Close">×</button>
    <div id="sidebar-content"></div>
  </aside>

  <script src="js/config.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/map.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

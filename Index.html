<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where We Met</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header id="app-header">
    <h1>Where We Met</h1>
    <p>Click anywhere on the map to pin a memory.</p>
  </header>

  <div id="map"></div>

  <div id="modal" class="hidden">
    <form id="memory-form">
      <h2>New Memory</h2>

      <label for="title">Title</label>
      <input type="text" id="title" placeholder="e.g. Our first date" required maxlength="80" />

      <label for="date">Date</label>
      <input type="date" id="date" />

      <label for="description">Description</label>
      <textarea id="description" rows="3" placeholder="What happened here?" maxlength="500"></textarea>

      <label for="photo">Photo</label>
      <input type="file" id="photo" accept="image/*" />

      <div class="form-actions">
        <button type="button" id="cancel-btn">Cancel</button>
        <button type="submit">Save Memory</button>
      </div>
    </form>
  </div>

  <!-- Memory sidebar -->
  <aside id="sidebar" aria-hidden="true">
    <button id="close-sidebar" aria-label="Close">×</button>
    <div id="sidebar-content"></div>
  </aside>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/storage.js"></script>
<script src="js/config.js"></script>
<script src="js/map.js"></script>
<script src="js/pins.js"></script>
<script src="js/app.js"></script>
</body>
</html>
